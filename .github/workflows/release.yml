name: Release

on:
    push:
        branches: [master, develop, next, alpha]

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            actions: write
            packages: write
            contents: write
            issues: write
            pull-requests: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: latest

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install

            - name: Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm dlx semantic-release
